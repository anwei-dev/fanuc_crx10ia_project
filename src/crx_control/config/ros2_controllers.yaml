# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100  # Hz

    manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Gazebo exports mimic state interfaces with a _mimic suffix. Publish only
# independent joints; URDF mimic relations supply dependent states in TF/MoveIt.
joint_state_broadcaster:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
      - robotiq_85_left_knuckle_joint
    interfaces:
      - position
      - velocity

manipulator_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Interpolate the timed trajectory instead of forwarding its final position.
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.01
      robotiq_85_left_knuckle_joint:
        trajectory: 0.05
        goal: 0.01
